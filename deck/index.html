  const only = window.ONLY || new URLSearchParams(location.search).get('only');
  const files = only ? window.ORDER.filter(f => only.split(',').some(o => o && f.startsWith(o.trim()))) : window.ORDER;
  window.DECK_VARIANT = 'template';
  Deck.boot(files.map(f => 'slides/' + f));
